<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sheehan Load Monitor</title>
    <meta name="description" content="Sheehan Driver Load Monitoring: GOMO data balance, promo expiry and load checks for every driver phone." />
    <meta name="theme-color" content="#1b1b1f" />

    <!-- Tab and home-screen icons -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Link previews (Facebook/Messenger, Viber, Telegram, WhatsApp, TikTok, Instagram, LinkedIn, Discord, Slack...).
         __SITE_URL__ is filled in at build time (see vite.config.js); crawlers need absolute image URLs. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Sheehan Load Monitor" />
    <meta property="og:title" content="Sheehan Load Monitor" />
    <meta property="og:description" content="GOMO data balance, promo expiry and load checks for every Sheehan driver phone, on desktop and mobile." />
    <meta property="og:url" content="__SITE_URL__/" />
    <meta property="og:image" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:secure_url" content="__SITE_URL__/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sheehan Load Monitor on a laptop and a phone" />
    <!-- X / Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sheehan Load Monitor" />
    <meta name="twitter:description" content="GOMO data balance, promo expiry and load checks for every Sheehan driver phone." />
    <meta name="twitter:image" content="__SITE_URL__/og-image.jpg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap"
    />
    <script>
      // Apply the saved theme before first paint so the page doesn't flash.
      try {
        var t = localStorage.getItem('slm-theme')
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
